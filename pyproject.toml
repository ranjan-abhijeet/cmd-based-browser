[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "web-search-cli"
version = "0.1.0"
description = "Command-line internet search and text browser tool"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ddgs>=9.0.0",
    "duckduckgo-search>=6.0.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
web-search = "web_search.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["web_search*"]
